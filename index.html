<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Gerador de Etiquetas de Café</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
    body {
        font-family: 'Arial Black', Impact, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        background: #e0e0e0;
        padding: 30px;
    }

    /* Controles da Interface */
    #controles {
        width: 800px;
        display: flex;
        justify-content: space-between;
        margin-bottom: 30px;
        background: white;
        padding: 20px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        border-radius: 8px;
    }

    select.interface-select, button#btnGenerate {
        padding: 12px 20px;
        font-size: 18px;
        font-weight: bold;
        border-radius: 4px;
        cursor: pointer;
    }

    select.interface-select {
        border: 2px solid black;
        width: 300px;
    }

    button#btnGenerate {
        background: black;
        color: white;
        border: none;
        transition: background 0.2s;
    }

    button#btnGenerate:hover {
        background: #333;
    }

    /* Contêiner da Etiqueta */
    .label-preview-area {
        position: relative;
    }

    .label-design {
        width: 800px;
        height: 530px;
        min-width: 800px;
        max-width: 800px;
        min-height: 530px;
        max-height: 530px;
        background: white;
        border: 12px solid black;
        box-sizing: border-box;
        padding: 12px;
        display: flex;
        flex-direction: column;
        display: none;
        text-transform: uppercase;
        overflow: hidden;
    }

    .label-design.active {
        display: flex;
    }

    /* Estilos Comuns */
    .header {
        background: black;
        color: white;
        text-align: center;
        padding: 12px 0;
        letter-spacing: 2px;
        margin-bottom: 12px;
    }

    .main-content {
        display: flex;
        flex: 1;
        border-top: 8px solid black;
        border-bottom: 8px solid black;
    }

    .col-left {
        width: 32%;
        border-right: 8px solid black;
        padding: 15px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }

    .col-right {
        width: 68%;
        display: flex;
        flex-direction: column;
    }

    .torra-tipo .label {
        font-family: Arial, sans-serif;
        font-size: 20px;
        font-weight: bold;
        margin-bottom: 5px;
    }

    /* SELECT CUSTOMIZADO */
    .custom-select {
        appearance: none;
        -webkit-appearance: none;
        background: transparent;
        border: none;
        font-family: inherit;
        font-size: inherit;
        font-weight: inherit;
        color: inherit;
        text-align: center;
        text-align-last: center;
        cursor: pointer;
        width: 100%;
        text-transform: uppercase;
        outline: none;
        padding: 0;
        margin: 0;
    }
    .custom-select:hover {
        background: rgba(0, 0, 0, 0.05);
    }
    .custom-select option {
        color: black;
        background: white;
    }

    .torra-tipo .value {
        white-space: nowrap;
        overflow: hidden;
    }

    .details-top {
        flex: 1;
        padding: 15px 25px;
        font-size: 32px;
        line-height: 1.5;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    .details-top div, .details-bottom div {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .details-bottom {
        background: black;
        color: white;
        text-align: center;
        padding: 15px;
        font-size: 24px;
        line-height: 1.5;
    }

    [contenteditable="true"] {
        outline: none;
    }
    [contenteditable="true"]:hover {
        background: rgba(0, 0, 0, 0.05);
    }

    /* DATAS CUSTOMIZADAS */
    .date-container {
        position: relative;
        cursor: pointer;
    }
    .date-container:hover {
        background: rgba(0, 0, 0, 0.05);
    }
    .hidden-date {
        opacity: 0;
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        cursor: pointer;
    }

    /* === Design 1 (Moscardini) === */
    #etiqueta1 .header {
        font-size: 52px;
    }
    #etiqueta1 .main-content {
        margin-bottom: 0px;
    }
    #etiqueta1 .torra-tipo .value {
        font-size: 48px;
    }
    #etiqueta1 .footer {
        display: flex;
        height: 90px;
        margin-top: 12px;
    }
    #etiqueta1 .date-box {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 26px;
    }
    #etiqueta1 .date-box:first-child {
        border-right: 8px solid black;
    }

    /* === Design 2 (Ciro Coffee) === */
    #etiqueta2 .header {
        font-size: 60px;
    }
    #etiqueta2 .torra-tipo .value {
        font-size: 48px;
    }
    #etiqueta2 .footer {
        display: flex;
        height: 90px;
    }
    #etiqueta2 .left-dates {
        width: 60%;
        border-right: 8px solid black;
        padding: 10px 15px;
        font-size: 20px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        line-height: 1.4;
    }
    #etiqueta2 .right-weight {
        width: 40%;
        font-size: 48px;
        font-family: 'Arial Black', sans-serif;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        padding-right: 25px;
    }
</style>
</head>
<body>

<div id="controles">
    <select id="selectDesign" class="interface-select" onchange="changeDesign()">
        <option value="1">Design 1 (Pote)</option>
        <option value="2">Design 2 (Capsula)</option>
    </select>
    <button id="btnGenerate" onclick="gerarImagem()">Gerar Imagem (PNG)</button>
</div>

<div class="label-preview-area">
    <!-- Label 1 (Irmãos Moscardini) -->
    <div id="etiqueta1" class="label-design active">
        <div class="header" contenteditable="true">IRMÃOS MOSCARDINI</div>
        <div class="main-content">
            <div class="col-left">
                <div class="torra-tipo">
                    <div class="label">TORRA</div>
                    <select class="custom-select value">
                        <option value="CLARA" selected>CLARA</option>
                        <option value="MÉDIA">MÉDIA</option>
                        <option value="ESCURA">ESCURA</option>
                    </select>
                </div>
                <div class="torra-tipo">
                    <div class="label">TIPO</div>
                    <select class="custom-select value">
                        <option value="ARÁBICA" selected>ARÁBICA</option>
                        <option value="CANÉFORA">CANÉFORA</option>
                    </select>
                </div>
            </div>
            <div class="col-right">
                <div class="details-top" contenteditable="true">
                    <div>TUPI</div>
                    <div>NATURAL</div>
                    <div>CARAMELO</div>
                </div>
                <div class="details-bottom" contenteditable="true">
                    <div>F. SÃO CRISTÓVÃO - 950M</div>
                    <div>CRISTAIS PAULISTA - SP</div>
                </div>
            </div>
        </div>
        <div class="footer">
            <div class="date-box date-container">
                <span class="date-text" data-prefix="TORRADO: ">TORRADO: 29/05/26</span>
                <input type="date" class="hidden-date" onchange="updateDateText(this)">
            </div>
            <div class="date-box date-container">
                <span class="date-text" data-prefix="ABERTO: ">ABERTO: 30/05/26</span>
                <input type="date" class="hidden-date" onchange="updateDateText(this)">
            </div>
        </div>
    </div>

    <!-- Label 2 (Ciro Coffee) -->
    <div id="etiqueta2" class="label-design">
        <div class="header" contenteditable="true">CIRO COFFEE</div>
        <div class="main-content">
            <div class="col-left">
                <div class="torra-tipo">
                    <div class="label">TORRA</div>
                    <select class="custom-select value">
                        <option value="CLARA">CLARA</option>
                        <option value="MÉDIA" selected>MÉDIA</option>
                        <option value="ESCURA">ESCURA</option>
                    </select>
                </div>
                <div class="torra-tipo">
                    <div class="label">TIPO</div>
                    <select class="custom-select value">
                        <option value="ARÁBICA" selected>ARÁBICA</option>
                        <option value="CANÉFORA">CANÉFORA</option>
                    </select>
                </div>
            </div>
            <div class="col-right">
                <div class="details-top" contenteditable="true">
                    <div>CATUAÍ VERMELHO</div>
                    <div>NATURAL</div>
                    <div>CARAMELO / CHOCOLATE / AMENDÔAS</div>
                </div>
                <div class="details-bottom" contenteditable="true">
                    <div>F. JULLIANA - 1200M</div>
                    <div>CHAPADA DIAMANTINA - BA</div>
                </div>
            </div>
        </div>
        <div class="footer">
            <div class="left-dates">
                <div class="date-container">
                    <span class="date-text" data-prefix="TORRADO: ">TORRADO: 27/04/26</span>
                    <input type="date" class="hidden-date" onchange="updateDateText(this)">
                </div>
                <div class="date-container">
                    <span class="date-text" data-prefix="ENVASADO: ">ENVASADO: 21/05/26</span>
                    <input type="date" class="hidden-date" onchange="updateDateText(this)">
                </div>
            </div>
            <div class="right-weight" contenteditable="true">20gr</div>
        </div>
    </div>
</div>

<script>
    function changeDesign() {
        const designNum = document.getElementById('selectDesign').value;
        document.querySelectorAll('.label-design').forEach(el => el.classList.remove('active'));
        document.getElementById(`etiqueta${designNum}`).classList.add('active');
    }

    function updateDateText(input) {
        if (!input.value) return;
        const [year, month, day] = input.value.split('-');
        const shortYear = year.slice(-2);
        const formatted = `${day}/${month}/${shortYear}`;
        const span = input.previousElementSibling;
        const prefix = span.getAttribute('data-prefix') || '';
        span.textContent = prefix + formatted;
    }

    function gerarImagem() {
        let activeLabel = document.querySelector('.label-design.active');
        
        if (!activeLabel) {
            alert("Erro: Nenhum design ativo encontrado.");
            return;
        }

        let filename = (activeLabel.id === 'etiqueta1') ? 'etiqueta_moscardini.png' : 'etiqueta_ciro_coffee.png';

        html2canvas(activeLabel, {scale: 2}).then(canvas => {
            let link = document.createElement('a');
            link.download = filename;
            link.href = canvas.toDataURL("image/png");
            link.click();
        });
    }
</script>

</body>
</html>
